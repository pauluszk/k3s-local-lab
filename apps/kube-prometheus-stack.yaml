apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: prometheus
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.10.1
    helm:
      valuesObject:
        grafana:
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.lab.local
          grafana.ini:
            server:
              root_url: http://grafana.lab.local
            users:
              auto_assign_org_role: Admin
        prometheus:
          prometheusSpec:
            retention: 3d

            resources:
              requests:
                memory: 512Mi
              limits:
                memory: 2Gi
        # k3s-specific: these components are not available
        # in this lab, so disable them to avoid false alerts.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true