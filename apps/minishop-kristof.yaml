apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minishop-kristof
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pauluszk/k3s-local-lab.git
    targetRevision: main
    path: minishop-kristof
  destination:
    server: https://kubernetes.default.svc
    namespace: minishop-kristof
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
