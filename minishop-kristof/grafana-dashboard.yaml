apiVersion: v1
kind: ConfigMap
metadata:
  name: minishop-kristof-dashboard
  namespace: prometheus
  labels:
    grafana_dashboard: "1"
data:
  minishop-kristof.json: |
    {
      "title": "Minishop Kristof",
      "uid": "minishop-kristof",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "Podinfo requests",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(podinfo_http_requests_total[1m]))",
              "legendFormat": "requests/sec"
            }
          ],
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "title": "Total requests",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(podinfo_http_requests_total)"
            }
          ],
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 8
          }
        }
      ]
    }